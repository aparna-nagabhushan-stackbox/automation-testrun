### Executes on Cloud (Lambdatest)
is.cloud=false
### Enable the Video Recording
record.video=false
### Enter waits for the element in seconds (increase wait if slow connection)
implicit.wait=10
explicit.wait=10
static.wait=5
### Set Headless mode for the web execution
is.headless=false
is.debug=false
### Attach screenshot to report (true/false)
is.screenshot=true
### Enable retry on failure, if, how many times
is.retry=true
retry.count=2
